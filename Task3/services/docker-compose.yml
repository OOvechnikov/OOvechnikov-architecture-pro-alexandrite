services:

  order:
    build:
      context: ./order
      dockerfile: Dockerfile
    container_name: order
    ports:
      - "8080:8080"
    environment:
      - JAEGER_ENDPOINT=http://jaeger:4318/v1/traces
      - PRICING_SERVICE_URL=http://pricing:8080/
    depends_on:
      - jaeger
      - pricing
    networks:
      - alexandrite-network

  pricing:
    build:
      context: ./pricing
      dockerfile: Dockerfile
    container_name: pricing
    environment:
      - JAEGER_ENDPOINT=http://jaeger:4318/v1/traces
    depends_on:
      - jaeger
    networks:
      - alexandrite-network

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - LOG_LEVEL=debug
    networks:
      - alexandrite-network

networks:
  alexandrite-network:
    driver: bridge